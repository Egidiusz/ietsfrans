<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FF7A1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit à petit">
<title>Petit à petit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF7A1A'/%3E%3Ccircle cx='31' cy='35' r='17' fill='%23FFF7EE'/%3E%3Ccircle cx='37' cy='31' r='3' fill='%2323233A'/%3E%3Cpath d='M47 33l9 3-9 4z' fill='%23F2B705'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFF7EE; --surface:#FFFFFF; --surface-2:#FFF0E0; --ink:#23233A; --muted:#6E6A7C; --line:#F0DFCB;
  --orange:#FF7A1A; --orange-deep:#D9560B; --orange-ink:#B54608; --sun:#F2B705;
  --green:#178A57; --green-soft:#E2F5EA; --amber:#A86A00; --amber-soft:#FFF1CF; --red:#C93A32; --red-soft:#FCE6E3;
  --grey-dot:#CFC7BD; --shadow:0 2px 0 rgba(35,35,58,.06), 0 8px 24px rgba(35,35,58,.06);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1A24; --surface:#252534; --surface-2:#2E2B33; --ink:#F5EFE8; --muted:#A9A3B5; --line:#363548;
    --orange:#FF8A33; --orange-deep:#FF7A1A; --orange-ink:#FFAA66; --sun:#F2B705;
    --green:#4CC98E; --green-soft:#1D3A2D; --amber:#F2C14E; --amber-soft:#3A3120; --red:#FF7A70; --red-soft:#3D2326;
    --grey-dot:#55536A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1A24; --surface:#252534; --surface-2:#2E2B33; --ink:#F5EFE8; --muted:#A9A3B5; --line:#363548;
  --orange:#FF8A33; --orange-deep:#FF7A1A; --orange-ink:#FFAA66; --sun:#F2B705;
  --green:#4CC98E; --green-soft:#1D3A2D; --amber:#F2C14E; --amber-soft:#3A3120; --red:#FF7A70; --red-soft:#3D2326;
  --grey-dot:#55536A; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.wordmark{font-weight:800;letter-spacing:-.01em;font-size:17px;color:var(--orange-ink)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}
.hero{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.hero .bird{width:84px;height:84px;flex:none}
.hero h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.today-counts{display:flex;gap:18px;margin:6px 0 16px}
.today-counts div{display:flex;flex-direction:column}
.today-counts b{font-size:34px;line-height:1;font-weight:800}
.today-counts span{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:0;font-weight:800;font-size:18px;transition:transform .08s ease}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-deep)}
.btn.primary:active{box-shadow:0 2px 0 var(--orange-deep)}
.btn.primary:disabled{opacity:.45;box-shadow:none;transform:none}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn.small{min-height:44px;font-size:16px;padding:0 14px;border-radius:13px}
.done-msg{font-size:20px;font-weight:800;margin:6px 0 4px}
.muted{color:var(--muted)}
.small{font-size:15px}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--grey-dot);margin:10px 0 8px}
.seg i{display:block;height:100%}
.drow{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:16px}
.drow .dcount{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
.ddot{width:12px;height:12px;border-radius:4px;flex:none}
.seg.slim{height:8px;margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.d-new{background:var(--grey-dot)} .d-learn{background:var(--orange)} .d-known{background:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:76px}
.tile b{display:block;font-size:17px}
.tile span{font-size:14px;color:var(--muted)}
.note-banner{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
.note-banner button{border:0;background:none;color:var(--orange-ink);font-weight:700;text-decoration:underline;padding:4px}

/* session */
.sbar{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:10px}
.progress{flex:1;height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .35s ease}
.sstars{font-weight:800;font-size:16px;min-width:52px;text-align:right}
.mode-tag{font-size:13px;font-weight:800;color:var(--orange-ink);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin:-4px 0 6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.qlabel{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.qtext{font-size:28px;font-weight:800;line-height:1.2;margin:8px 0 16px;letter-spacing:-.01em;overflow-wrap:anywhere}
.qtext.fr{color:var(--orange-ink)}
.qsub{font-size:20px;color:var(--muted);margin:-8px 0 16px}
.say{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:0;background:var(--surface-2);color:var(--orange-ink);flex:none}
.say svg{width:24px;height:24px}
.say.inline{width:38px;height:38px;border-radius:12px;vertical-align:middle;margin-left:6px}
.answer{width:100%;min-height:56px;border:2px solid var(--line);border-radius:16px;background:var(--bg);padding:10px 14px;font-size:22px;font-weight:600;outline:none}
.answer:focus{border-color:var(--orange)}
.answer[readonly]{opacity:.8}
.answer.s-ok{border-color:var(--green);background:var(--green-soft)}
.answer.s-near{border-color:var(--amber);background:var(--amber-soft)}
.answer.s-wrong{border-color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-thickness:2px}
.accents{display:flex;gap:5px;margin:10px 0 12px}
.accents button{flex:1 1 0;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:21px;font-weight:700;padding:0}
.accents button:active{background:var(--orange);color:#fff}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.row .btn.ghost{flex:0 0 auto}
.fb{border-radius:18px;padding:14px;margin-top:12px}
.fb.ok{background:var(--green-soft)} .fb.near{background:var(--amber-soft)} .fb.wrong{background:var(--red-soft)}
.fb-title{font-weight:800;font-size:20px;margin-bottom:4px}
.fb.ok .fb-title{color:var(--green)} .fb.near .fb-title{color:var(--amber)} .fb.wrong .fb-title{color:var(--red)}
.fb-note{font-size:16px;margin-bottom:6px}
.fb-answer{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow-wrap:anywhere}
.fb-answer mark{background:none;color:var(--red);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.fb.near .fb-answer mark{color:var(--amber)}
.retype-label{font-size:15px;font-weight:700;margin:14px 0 6px}
.next-wrap{margin-top:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--bg);text-align:left;padding:10px 14px;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt:active{border-color:var(--orange)}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt.dim{opacity:.5}
.intro-badge{display:inline-block;background:var(--sun);color:#23233A;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800;letter-spacing:.04em}
.divider{height:1px;background:var(--line);margin:4px 0 14px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.shake{animation:shake .35s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* end */
.end{text-align:center;padding-top:18px}
.end .bird{width:130px;height:130px}
.end h1{font-size:30px;margin:10px 0 6px}
.statrow{display:flex;justify-content:center;gap:12px;margin:18px 0 24px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;min-width:92px}
.stat b{display:block;font-size:26px}
.stat span{font-size:13px;color:var(--muted)}

/* words & settings */
.page-title{font-size:24px;font-weight:800;margin:0}
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.witem{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.witem .txt{flex:1;min-width:0}
.witem .nl{font-size:15px;color:var(--muted)}
.witem .fr{font-size:18px;font-weight:700;color:var(--orange-ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.p-new{background:var(--surface-2);color:var(--muted)} .p-learn{background:var(--amber-soft);color:var(--amber)} .p-known{background:var(--green-soft);color:var(--green)}
.sect{margin-top:18px}
.sect h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow label{flex:1}
.setrow .hint{display:block;font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:30px;text-align:center;font-size:20px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:800}
.textin{min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:6px 10px;width:150px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:var(--grey-dot);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{left:23px}
.stack{display:flex;flex-direction:column;gap:10px}
.fine{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:15px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.pop,.shake{animation:none}.progress i{transition:none}.confetti{display:none}}
@media (min-width:480px){.qtext{font-size:32px}}
</style>

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const now = () => Date.now();
function dayKey(t){ const d=new Date(t - DAY_START_HOUR*3600e3); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function prevDay(key){ const [y,m,d]=key.split('-').map(Number); const t=new Date(y,m-1,d,12); t.setDate(t.getDate()-1); return dayKey(t.getTime()+DAY_START_HOUR*3600e3); }

function migrate(s){ const d=defaultState(); if(!s||typeof s!=='object') return d; return { ...d, ...s, settings:{...d.settings, ...(s.settings||{}), decks:{...((s.settings||{}).decks||{})}}, daily:{...d.daily, ...(s.daily||{})}, stats:{...d.stats, ...(s.stats||{})}, items:s.items||{} }; }

let toastTimer;
function toast(msg){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.hidden=true;},3200); }
function confetti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const box=document.createElement('div'); box.className='confetti'; const cols=['#FF7A1A','#F2B705','#178A57','#4C8DF6','#E85D9A']; for(let i=0;i<46;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=pick(cols); p.style.animationDuration=(1.6+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.5)+'s'; p.style.transform=`rotate(${Math.random()*360}deg)`; box.appendChild(p);} document.body.appendChild(box); setTimeout(()=>box.remove(),4000); }

/* ---------- planning ---------- */
const itemKey = (cid, dir) => cid + ':' + dir;
const parseKey = k => { const i=k.lastIndexOf(':'); return { cid:k.slice(0,i), dir:k.slice(i+1) }; };
function getItem(k){ return S.items[k]; }
function ensureItem(k){ if(!S.items[k]) S.items[k] = { card: JSON.parse(JSON.stringify(F.createEmptyCard(new Date()))), ok:0, bad:0 }; return S.items[k]; }
const isNew = k => { const it=getItem(k); return !it || it.card.state === 0; };
const dueTime = k => Date.parse(getItem(k).card.due);
function isDue(k, t){ const it=getItem(k); if(!it || it.card.state===0) return false; const st=it.card.state; if(st===1||st===3) return dueTime(k) <= t + LEARN_AHEAD || dayKey(dueTime(k)) < dayKey(t); return dayKey(dueTime(k)) <= dayKey(t); }
function writeUnlocked(cid, t){ const r=getItem(itemKey(cid,'r')); return !!(r && r.firstOk && Date.parse(r.firstOk) < t); }
function resetDaily(t){ const d=dayKey(t); if(S.daily.day!==d){ S.daily={ day:d, newDone:0 }; } }
function status(k){ const it=getItem(k); if(!it || it.card.state===0) return 'new'; if(it.card.state===2 && it.card.scheduled_days>=7) return 'known'; return 'learn'; }

function plan(t){
  resetDaily(t);
  const reviews=[], newR=[], newW=[];
  for (const c of activeCards()){
    for (const dir of ['r','w']){
      const k=itemKey(c.id,dir);
      if (!isNew(k)) { if (isDue(k,t)) reviews.push(k); }
      else if (dir==='r') newR.push(k);
      else if (writeUnlocked(c.id,t)) newW.push(k);
    }
  }
  const limit=Math.max(0, S.settings.newPerDay - S.daily.newDone);
  const news=[]; let i=0;
  while (news.length<limit && (i<newW.length || i<newR.length)){ if(i<newW.length) news.push(newW[i]); if(news.length<limit && i<newR.length) news.push(newR[i]); i++; }
  return { reviews, news };
}
function buildQueue(t){
  const { reviews, news } = plan(t);
  shuffle(reviews);
  const out=[]; let ri=0;
  news.forEach((n,ni)=>{ const target=Math.round((ni+1)*reviews.length/(news.length+1)); while(ri<target) out.push(reviews[ri++]); out.push(n); });
  while(ri<reviews.length) out.push(reviews[ri++]);
  return out;
}

/* ---------- antwoorden nakijken ---------- */
function sk(s){ return String(s).normalize('NFC').toLowerCase().replace(/[’‘`´ʼ]/g,"'").replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[.,;:!?¡¿«»"“”()\/…]/g,' ').replace(/\s*'\s*/g,"'").replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim(); }
const noAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const loose = s => noAcc(s).replace(/[^a-z]/g,'');
function splitArt(k){ const m=k.match(/^(une|un|les|le|la)\s+|^(l')/); if(!m) return [null,k]; return [m[1]||m[2], k.slice(m[0].length)]; }
const GENDER = { un:'(mannelijk)', le:'(mannelijk)', une:'(vrouwelijk)', la:'(vrouwelijk)', les:'(meervoud)', "l'":'' };
function evaluate(card, raw){
  const inp=sk(raw);
  if(!inp) return { g:'wrong', idk:true };
  const targets=[card.fr, ...(card.accept||[])];
  for (const t of targets) if (sk(t)===inp) return { g:'ok' };
  for (const t of targets){ const ti=sk(t); if (loose(ti)===loose(inp)){
    if (noAcc(ti)===noAcc(inp)) return { g:'near', note:'Let op de accenten.' };
    const accDiff = ti.replace(/[-' ]/g,'') !== inp.replace(/[-' ]/g,'');
    return { g:'near', note: accDiff ? 'Let op de accenten en het streepje of de apostrof.' : 'Let op het streepje of de apostrof.' };
  } }
  for (const n of card.near||[]) if (loose(sk(n.a))===loose(inp)) return { g:'near', note:n.note };
  const nlk=loose(sk(card.nl));
  for (const c of CARDS.values()) if (c!==card && loose(sk(c.nl))===nlk && loose(sk(c.fr))===loose(inp)) return sk(c.fr)===inp ? { g:'ok', note:`Ook juist! Op dit kaartje staat: <b>${esc(card.fr)}</b>.` } : { g:'near', note:`Ook goed, maar let op de schrijfwijze: <b>${esc(c.fr)}</b>. Op dit kaartje staat: <b>${esc(card.fr)}</b>.` };
  if (card.fr.includes(',')){ const parts=card.fr.split(',').map(p=>loose(sk(p))); if (parts.includes(loose(inp))) return { g:'near', note:'Ken je ook de andere vorm?' }; }
  const [ta, trest]=splitArt(sk(card.fr));
  if (ta){ const [ia, irest]=splitArt(inp);
    if (loose(irest)===loose(trest)){
      if (!ia) return { g:'wrong', note:'Vergeet het lidwoord niet!' };
      if (ia!==ta) return { g:'wrong', note:`Let op het lidwoord: <b>${esc(ta)}</b> ${GENDER[ta]||''}` };
    }
  }
  for (const c of CARDS.values()) if (c!==card && loose(sk(c.fr))===loose(inp)) return { g:'wrong', note:`Dat is het Frans voor “${esc(c.nl)}”.` };
  return { g:'wrong' };
}
function retypeOk(card, raw){ const k=loose(sk(raw)); return [card.fr, ...(card.accept||[])].some(t=>loose(sk(t))===k); }
function diffMark(input, target){
  const a=[...input.toLowerCase()], b=[...target]; const bl=b.map(c=>c.toLowerCase());
  const n=a.length, m=b.length; const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = a[i]===bl[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const keep=new Array(m).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===bl[j]){keep[j]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const kept=keep.filter(Boolean).length; if (kept < 0.6*b.filter(c=>c!==' ').length) return esc(target);
  return b.map((c,k)=> keep[k]||c===' ' ? esc(c) : `<mark>${esc(c)}</mark>`).join('');
}

/* ---------- sessie ---------- */
let SES=null;
function startSession(mode){
  askPersist();
  const t=now();
  if (mode==='practice'){
    const pool=[];
    for (const c of activeCards()) for (const dir of ['r','w']){ const k=itemKey(c.id,dir); if(!isNew(k)) pool.push(k); }
    if (!pool.length){ toast('Leer eerst een paar kaartjes in je dagelijkse ronde.'); return; }
    SES={ mode, queue:shuffle(pool).slice(0,12), learning:new Set(), retried:new Set(), last:null, lastCid:null, start:t, answered:0, ok:0, stars:0, introduced:new Set() };
  } else {
    SES={ mode:'daily', queue:buildQueue(t), learning:new Set(), retried:new Set(), last:null, lastCid:null, start:t, answered:0, ok:0, stars:0, introduced:new Set() };
    if (!SES.queue.length){ SES=null; renderHome(); return; }
  }
  nextCard();
}
function takeFromQueue(){
  let idx=0;
  if (SES.queue.length>1 && parseKey(SES.queue[0]).cid===SES.lastCid){ const alt=SES.queue.findIndex(k=>parseKey(k).cid!==SES.lastCid); if(alt>0) idx=alt; }
  return SES.queue.splice(idx,1)[0];
}
function nextCard(){
  const t=now(); let k=null;
  if (SES.mode==='daily'){
    const byDue=(a,b)=>dueTime(a)-dueTime(b);
    const dueL=[...SES.learning].filter(x=>dueTime(x)<=t && x!==SES.last).sort(byDue);
    if (dueL.length) k=dueL[0];
    else if (SES.queue.length) k=takeFromQueue();
    else { const ahead=[...SES.learning].filter(x=>dueTime(x)<=t+LEARN_AHEAD).sort(byDue); if(ahead.length) k = (ahead.length>1 && ahead[0]===SES.last) ? ahead[1] : ahead[0]; }
  } else if (SES.queue.length) k=takeFromQueue();
  if (!k) return finishSession(true);
  const { cid, dir } = parseKey(k);
  const card=CARDS.get(cid);
  if (!card){ delete S.items[k]; SES.learning.delete(k); return nextCard(); }
  SES.current=k;
  if (SES.mode==='daily' && dir==='r' && isNew(k) && !SES.introduced.has(k)) return renderIntro(k, card);
  if (dir==='r') renderChoice(k, card); else renderTyping(k, card);
}
function progressPct(){ const total=SES.answered+SES.queue.length+SES.learning.size+1; return Math.round(100*SES.answered/total); }

function record(k, grade){ // grade: 'ok' | 'near' | 'wrong'
  const t=now(); const { cid, dir } = parseKey(k);
  const stars = grade==='ok' ? 2 : grade==='near' ? 1 : 0;
  SES.answered++; if(grade!=='wrong') SES.ok++; SES.stars+=stars;
  S.stats.stars+=stars; S.stats.answers++;
  if (SES.mode==='daily'){
    const wasNew=isNew(k); const it=ensureItem(k);
    const rating = grade==='ok' ? F.Rating.Good : grade==='near' ? F.Rating.Hard : F.Rating.Again;
    const res=scheduler.next(it.card, new Date(t), rating);
    it.card=JSON.parse(JSON.stringify(res.card));
    if (wasNew){ resetDaily(t); S.daily.newDone++; }
    if (grade==='wrong') it.bad++; else { it.ok++; if(!it.firstOk) it.firstOk=new Date(t).toISOString(); }
    if (it.card.state===1 || it.card.state===3) SES.learning.add(k); else SES.learning.delete(k);
  } else if (grade==='wrong' && !SES.retried.has(k)){ SES.retried.add(k); SES.queue.push(k); }
  SES.last=k; SES.lastCid=cid;
  save();
}
function finishSession(complete){
  const s=SES; SES=null;
  if (s.mode==='daily' && complete){
    const today=dayKey(now());
    if (S.stats.lastDone!==today){ S.stats.streak = (S.stats.lastDone===prevDay(today)) ? S.stats.streak+1 : 1; S.stats.lastDone=today; S.stats.best=Math.max(S.stats.best,S.stats.streak); }
    save();
  }
  if (!s.answered) return renderHome();
  renderEnd(s, complete);
}
function quitSession(){ if(!SES) return renderHome(); const s=SES; if(s.answered) finishSession(false); else { SES=null; renderHome(); } }

  const seenAny = Object.values(S.items).some(it=>it.card.state!==0);
  const backupOld = S.stats.answers>80 && (now()-(S.lastExport||0)) > 30*86400e3;
  app().innerHTML = `
    <div class="topbar"><span class="wordmark">Petit à petit</span><button class="icon-btn" id="b-set" aria-label="Instellingen">${ICON_GEAR}</button></div>
    <div class="hero">${bird(total? 'happy':'cheer')}<div><h1>Salut ${esc(S.name||'')} !</h1><p>${total ? 'Klaar voor je Frans?' : (todayDone ? 'Alles gedaan voor vandaag. Bravo !' : 'Niets te doen vandaag.')}</p></div></div>
    <div class="chips"><span class="chip">🔥 ${streak} ${streak===1?'dag':'dagen'} op rij</span><span class="chip">⭐ ${S.stats.stars}</span></div>
    <div class="panel"><h2>Vandaag</h2>
      ${ total ? `<div class="today-counts"><div><b>${reviews.length}</b><span>herhalen</span></div><div><b>${news.length}</b><span>nieuw</span></div></div>
        <button class="btn primary block" id="b-start">Start</button>`
      : `<div class="done-msg">${todayDone ? 'Klaar ! 🎉' : 'Alles bijgewerkt'}</div><div class="muted small">${tomorrowCount ? `Morgen staan er ${tomorrowCount} kaartjes klaar.` : 'Kom morgen terug voor nieuwe kaartjes.'}</div>` }
    </div>
    ${decks}
    <div class="grid2">
      <button class="tile" id="b-practice" ${seenAny?'':'aria-disabled="true"'}><b>Vrij oefenen</b><span>Kaartjes die je al zag</span></button>
      <button class="tile" id="b-words"><b>Mijn woorden</b><span>Alle kaartjes bekijken</span></button>
    </div>
    ${backupOld ? `<div class="note-banner">Voor ouders: maak eens een back-up van de voortgang. <button id="b-backup">Nu doen</button></div>` : ''}`;
  $('#b-set').onclick=renderSettings;
  const st=$('#b-start'); if(st) st.onclick=()=>startSession('daily');
  $('#b-practice').onclick=()=>startSession('practice');
  $('#b-words').onclick=renderWords;
  const bb=$('#b-backup'); if(bb) bb.onclick=exportData;
}

function sessionBar(){
  return `<div class="sbar"><button class="icon-btn" id="b-quit" aria-label="Stoppen">${ICON_X}</button>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progressPct()}"><i style="width:${progressPct()}%"></i></div>
    <span class="sstars">⭐ ${SES.stars}</span></div>
    ${SES.mode==='practice' ? '<div class="mode-tag">Vrij oefenen</div>' : ''}`;
}
function bindQuit(){ $('#b-quit').onclick=quitSession; }

function renderIntro(k, card){
  app().innerHTML = `${sessionBar()}
    <div class="qcard pop">
      <div class="qlabel"><span class="intro-badge">${card.kind==='s'?'NIEUWE ZIN':'NIEUW WOORD'}</span>${sayBtn(card.fr)}</div>
      <div class="qtext fr">${esc(card.fr)}</div>
      <div class="qsub">${esc(card.nl)}</div>
      <div class="divider"></div>
      <div class="muted small" style="margin-bottom:12px">Lees het, luister, en zeg het eens hardop.</div>
      <button class="btn primary block" id="b-next">Begrepen !</button>
    </div>`;
  bindQuit();
  if (S.settings.autoSpeak) speak(card.fr);
  const go=()=>{ SES.introduced.add(k); SES.queue.splice(Math.min(2, SES.queue.length), 0, k); SES.lastCid=card.id; SES.last=k; nextCard(); };
  $('#b-next').onclick=go; $('#b-next').focus({preventScroll:true});
}

function renderChoice(k, card){
  const okD=c=>c!==card && c.kind===card.kind && loose(sk(c.nl))!==loose(sk(card.nl)) && loose(sk(c.fr))!==loose(sk(card.fr));
  let pool=activeCards().filter(okD); if(pool.length<3) pool=[...CARDS.values()].filter(okD);
  const opts=shuffle([card, ...shuffle(pool).slice(0,3)]);
  app().innerHTML = `${sessionBar()}
    <div class="qcard pop">
      <div class="qlabel"><span>Wat betekent dit?</span>${sayBtn(card.fr)}</div>
      <div class="qtext fr">${esc(card.fr)}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span>${esc(o.nl)}</span><span class="mk"></span></button>`).join('')}</div>
      <div class="next-wrap" id="nx"></div>
    </div>`;
  bindQuit();
  if (S.settings.autoSpeak) speak(card.fr);
  let answered=false;
  app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(answered) return; answered=true;
    const chosen=opts[+b.dataset.i]; const right = chosen===card;
    app().querySelectorAll('.opt').forEach(x=>{ const o=opts[+x.dataset.i]; if(o===card){ x.classList.add('ok'); x.querySelector('.mk').textContent='✓'; } else if(x===b){ x.classList.add('bad'); x.querySelector('.mk').textContent='✗'; } else x.classList.add('dim'); });
    record(k, right?'ok':'wrong');
    $('.sstars').textContent='⭐ '+SES.stars;
    if (right){ setTimeout(()=>{ if(SES && SES.current===k) nextCard(); }, 900); }
    else { b.closest('.qcard').classList.add('shake'); $('#nx').innerHTML='<button class="btn primary block" id="b-next">Verder</button>'; $('#b-next').onclick=nextCard; $('#b-next').focus({preventScroll:true}); }
  });
}

function accentBar(){ return `<div class="accents" aria-label="Letters met accent">${ACCENTS.map(a=>`<button type="button" data-ch="${esc(a)}" tabindex="-1">${esc(a)}</button>`).join('')}</div>`; }
function bindAccents(scope, getInput){
  scope.querySelectorAll('.accents button').forEach(b=>{
    b.addEventListener('pointerdown', e=>e.preventDefault());
    b.addEventListener('mousedown', e=>e.preventDefault());
    b.addEventListener('click', ()=>{ const el=getInput(); if(!el || el.readOnly) return; const s=el.selectionStart ?? el.value.length, en=el.selectionEnd ?? s; el.setRangeText(b.dataset.ch, s, en, 'end'); el.dispatchEvent(new Event('input')); el.focus({preventScroll:true}); });
  });
}
const INPUT_ATTRS = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" lang="fr"';

function renderTyping(k, card){
  app().innerHTML = `${sessionBar()}
    <div class="qcard pop" id="qc">
      <div class="qlabel"><span>Schrijf in het Frans</span></div>
      <div class="qtext">${esc(card.nl)}</div>
      <form id="f" autocomplete="off">
        <input class="answer" id="ans" type="text" ${INPUT_ATTRS} aria-label="Jouw antwoord in het Frans">
        <div id="acc-wrap">${accentBar()}</div>
        <div class="row" id="actions"><button type="button" class="btn ghost" id="b-idk">Weet ik niet</button><button class="btn primary" id="b-check">Controleer</button></div>
      </form>
      <div id="fb"></div>
    </div>`;
  bindQuit();
  const inp=$('#ans'); let active=inp;
  bindAccents(app(), ()=>active);
  setTimeout(()=>inp.focus({preventScroll:true}), 30);
  let phase='ask';
  const finish=(grade)=>{ record(k, grade); $('.sstars').textContent='⭐ '+SES.stars; };
  const check=(idk)=>{
    if (phase!=='ask') return;
    if (!idk && !inp.value.trim()) { inp.focus(); return; }
    phase='fb';
    const res = idk ? { g:'wrong', idk:true } : evaluate(card, inp.value);
    inp.readOnly=true; inp.classList.add('s-'+res.g);
    $('#actions').remove();
    finish(res.g);
    if (S.settings.autoSpeak) speak(card.fr);
    const fbEl=$('#fb');
    const shown = res.g==='ok' ? esc(card.fr) : (res.idk ? esc(card.fr) : diffMark(inp.value.trim(), card.fr));
    if (res.g==='ok'){
      $('#acc-wrap').remove();
      fbEl.innerHTML = `<div class="fb ok pop"><div class="fb-title">${pick(PRAISE)} +2 ⭐</div>${res.note?`<div class="fb-note">${res.note}</div>`:''}<div class="fb-answer"><span>${shown}</span>${sayBtn(card.fr,'inline')}</div></div><div class="next-wrap"><button class="btn primary block" id="b-next">Verder</button></div>`;
      phase='next';
    } else if (res.g==='near'){
      $('#acc-wrap').remove();
      fbEl.innerHTML = `<div class="fb near pop"><div class="fb-title">Bijna ! +1 ⭐</div><div class="fb-note">${res.note||''}</div><div class="fb-answer"><span>${shown}</span>${sayBtn(card.fr,'inline')}</div></div><div class="next-wrap"><button class="btn primary block" id="b-next">Verder</button></div>`;
      phase='next';
    } else {
      $('#qc').classList.add('shake');
      $('#acc-wrap').remove();
      fbEl.innerHTML = `<div class="fb wrong"><div class="fb-title">${res.idk?'Geen probleem':'Nog niet…'}</div>${res.note?`<div class="fb-note">${res.note}</div>`:''}<div class="fb-note">${res.idk?'Zo schrijf je het:':'Het juiste antwoord:'}</div><div class="fb-answer"><span>${shown}</span>${sayBtn(card.fr,'inline')}</div></div>
        <div class="retype-label">Typ het één keer juist over:</div>
        <form id="f2" autocomplete="off"><input class="answer" id="ans2" type="text" ${INPUT_ATTRS} aria-label="Typ het juiste antwoord over">${accentBar()}<button class="btn primary block" id="b-next" disabled>Verder</button></form>`;
      if (res.idk) inp.style.display='none';
      const in2=$('#ans2'); active=in2; bindAccents($('#f2'), ()=>active);
      in2.addEventListener('input', ()=>{ $('#b-next').disabled = !retypeOk(card, in2.value); });
      $('#f2').addEventListener('submit', e=>{ e.preventDefault(); if(retypeOk(card,in2.value)) nextCard(); else { in2.classList.remove('shake'); void in2.offsetWidth; in2.classList.add('shake'); } });
      setTimeout(()=>in2.focus({preventScroll:true}), 30);
      phase='retype';
      return;
    }
    const nb=$('#b-next'); nb.onclick=nextCard; setTimeout(()=>nb.focus({preventScroll:true}),30);
  };
  $('#f').addEventListener('submit', e=>{ e.preventDefault(); if(phase==='ask') check(false); else if(phase==='next') nextCard(); });
  $('#b-idk').onclick=()=>check(true);
}

function renderEnd(s, complete){
  const pct = s.answered ? Math.round(100*s.ok/s.answered) : 0;
  const streak=streakNow();
  const title = s.mode==='practice' ? 'Goed geoefend !' : complete ? `Bravo ${esc(S.name||'')} !` : 'Tot straks !';
  const sub = s.mode==='practice' ? 'Oefenen telt niet mee voor je planning.' : complete ? 'Je ronde voor vandaag is klaar.' : 'Je voortgang is bewaard. Je kan later verdergaan.';
  app().innerHTML = `<div class="end">${bird('cheer')}<h1>${title}</h1><div class="muted">${sub}</div>
    <div class="statrow"><div class="stat"><b>${s.ok}/${s.answered}</b><span>juist (${pct}%)</span></div><div class="stat"><b>+${s.stars}</b><span>sterren ⭐</span></div>${s.mode==='daily'?`<div class="stat"><b>${streak}</b><span>${streak===1?'dag':'dagen'} op rij 🔥</span></div>`:''}</div>
    <button class="btn primary block" id="b-home">Terug naar start</button></div>`;
  $('#b-home').onclick=renderHome; $('#b-home').focus({preventScroll:true});
  if (complete && s.answered) confetti();
}

function renderWords(){
  const lab={new:'nieuw',learn:'aan het leren',known:'gekend'}, cls={new:'p-new',learn:'p-learn',known:'p-known'};
  app().innerHTML = `<div class="topbar"><button class="icon-btn" id="b-back" aria-label="Terug">${ICON_BACK}</button><h1 class="page-title" style="flex:1">Mijn woorden</h1></div>
    <div class="legend" style="margin-top:6px"><span><i class="dot d-known"></i>gekend</span><span><i class="dot d-learn"></i>aan het leren</span><span><i class="dot d-new"></i>nieuw</span></div>
    ${DECKS.filter(d=>S.settings.decks[d.id]!==false).map(d=>`<div class="sect"><h3><span class="ddot" style="display:inline-block;margin-right:6px;background:${d.color||'var(--orange)'}"></span>${esc(d.title)}</h3><div class="wlist">${d.cards.map(c=>{ const r=status(itemKey(c.id,'r')), w=status(itemKey(c.id,'w'));
      return `<div class="witem">${sayBtn(c.fr)}<div class="txt"><div class="fr">${esc(c.fr)}</div><div class="nl">${esc(c.nl)}</div><div class="pills"><span class="pill ${cls[r]}" title="Frans → Nederlands">lezen: ${lab[r]}</span><span class="pill ${cls[w]}" title="Nederlands → Frans">schrijven: ${lab[w]}</span></div></div></div>`; }).join('')}</div></div>`).join('')}`;
  $('#b-back').onclick=renderHome;
}

function renderSettings(){
  const last = S.lastExport ? new Date(S.lastExport).toLocaleDateString('nl-BE') : 'nog nooit';
  app().innerHTML = `<div class="topbar"><button class="icon-btn" id="b-back" aria-label="Terug">${ICON_BACK}</button><h1 class="page-title" style="flex:1">Instellingen</h1></div>
    <div class="sect"><h3>Leren</h3><div class="panel" style="padding:4px 16px">
      <div class="setrow"><label for="s-name">Naam</label><input class="textin" id="s-name" value="${esc(S.name||'')}" maxlength="20" autocomplete="off"></div>
      <div class="setrow"><label>Nieuwe kaartjes per dag<span class="hint">Lezen en schrijven tellen elk apart</span></label><div class="stepper"><button id="s-minus" aria-label="Minder">−</button><b id="s-npd">${S.settings.newPerDay}</b><button id="s-plus" aria-label="Meer">+</button></div></div>
      <div class="setrow"><label for="s-speak">Automatisch voorlezen<span class="hint">${!canSpeak?'Niet beschikbaar in deze browser':noFrenchVoice()?'Geen Franse stem gevonden: installeer er een in de spraakinstellingen van het toestel':'Stem: '+esc(frVoice?frVoice.name:'standaard Franse stem')}</span></label><input type="checkbox" class="switch" id="s-speak" ${S.settings.autoSpeak?'checked':''} ${canSpeak?'':'disabled'}></div>
      ${canSpeak?'<div class="setrow"><span>Uitspraak testen</span><button class="btn ghost small" data-say="Bonjour ! Comment ça va ?">🔊 Bonjour</button></div>':''}
    </div></div>
    <div class="sect"><h3>Hoofdstukken</h3><div class="panel" style="padding:4px 16px">
      ${DECKS.map(d=>`<div class="setrow"><label for="d-${d.id}">${esc(d.title)}<span class="hint">${d.cards.length} kaartjes</span></label><input type="checkbox" class="switch" id="d-${d.id}" data-deck="${d.id}" ${S.settings.decks[d.id]!==false?'checked':''}></div>`).join('')}
    </div></div>
    <div class="sect"><h3>Voortgang bewaren</h3><div class="panel">
      <div class="muted small" style="margin-bottom:12px">Alles wordt alleen op dit toestel bewaard, in deze browser. Wis je de browsergegevens, dan is de voortgang weg. Maak daarom af en toe een back-up. Laatste back-up: <b>${last}</b>. <span id="persist-info"></span></div>
      <div class="stack"><button class="btn primary block" id="s-export">Back-up maken</button>
      <label class="btn ghost block" for="s-import" style="cursor:pointer">Back-up terugzetten</label><input type="file" id="s-import" accept="application/json,.json" hidden></div>
    </div></div>
    <div class="sect"><h3>Opnieuw beginnen</h3><div class="panel"><button class="btn ghost block" id="s-reset" style="color:var(--red)">Alle voortgang wissen</button></div></div>
    <div class="fine">Petit à petit · herhaalplanning met FSRS (ts-fsrs, MIT-licentie). Geen accounts, geen tracking: niets verlaat dit toestel.</div>`;
  $('#b-back').onclick=renderHome;
  $('#s-name').addEventListener('input', e=>{ S.name=e.target.value.trim(); save(); });
  const setN=n=>{ S.settings.newPerDay=Math.max(0,Math.min(30,n)); $('#s-npd').textContent=S.settings.newPerDay; save(); };
  $('#s-minus').onclick=()=>setN(S.settings.newPerDay-1); $('#s-plus').onclick=()=>setN(S.settings.newPerDay+1);
  $('#s-speak').onchange=e=>{ S.settings.autoSpeak=e.target.checked; save(); };
  app().querySelectorAll('[data-deck]').forEach(x=>x.onchange=()=>{ S.settings.decks[x.dataset.deck]=x.checked; save(); });
  $('#s-export').onclick=exportData;
  $('#s-import').onchange=e=>{ const f=e.target.files[0]; if(f) importData(f); e.target.value=''; };
  $('#s-reset').onclick=()=>{ if(confirm('Alle voortgang wissen? Sterren, reeks en planning gaan verloren.') && confirm('Echt zeker? Dit kan niet ongedaan gemaakt worden.')){ const name=S.name, settings=S.settings; S=defaultState(); S.name=name; S.settings=settings; save(); toast('Voortgang gewist.'); renderHome(); } };
  try{ if(navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p=>{ const el=$('#persist-info'); if(el) el.textContent = p ? 'De browser houdt deze gegevens bij plaatsgebrek bij.' : ''; }).catch(()=>{}); }catch(e){}
}

function exportData(){
  try{
    const t=now(); S.lastExport=t; save();
    const payload={ app:'petit-a-petit', version:1, exportedAt:new Date(t).toISOString(), state:S };
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`petit-a-petit-backup-${dayKey(t+DAY_START_HOUR*3600e3)}.json`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Back-up gemaakt. Bewaar het bestand goed.');
    if ($('#s-export')) renderSettings();
  }catch(e){ toast('Back-up maken lukte niet.'); }
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p || p.app!=='petit-a-petit' || !p.state || typeof p.state.items!=='object') throw 0;
      if(!confirm('Deze back-up vervangt de huidige voortgang. Doorgaan?')) return;
      S=migrate(p.state); save(); toast('Back-up teruggezet.'); renderHome();
    }catch(e){ toast('Dit is geen geldig back-upbestand.'); } };
  r.readAsText(file);
}

document.addEventListener('keydown', e=>{ if(SES && /^[1-4]$/.test(e.key)){ const b=app().querySelectorAll('.opt')[+e.key-1]; if(b && document.activeElement?.tagName!=='INPUT') b.click(); } });
renderHome();
</script>
</body>
